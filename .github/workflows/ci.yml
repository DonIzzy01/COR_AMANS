name: CI / CD

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

jobs:
  # ── 1. Lint & syntax check (all branches) ──────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: pip install -r requirements.txt flake8

      - name: Flake8 (syntax + style)
        run: flake8 app.py models.py config.py extensions.py --max-line-length=120 --ignore=E501,W503

      - name: Check templates compile
        run: |
          python - <<'EOF'
          from app import app
          with app.app_context():
              from jinja2 import Environment, FileSystemLoader
              env = Environment(loader=FileSystemLoader('templates'))
              import os
              for root, _, files in os.walk('templates'):
                  for f in files:
                      if f.endswith('.html'):
                          path = os.path.relpath(os.path.join(root, f), 'templates')
                          try:
                              env.get_template(path)
                          except Exception as e:
                              print(f'ERROR in {path}: {e}')
                              raise
          print('All templates OK')
          EOF

  # ── 2. Build Docker image (develop + staging + main) ───
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref != 'refs/heads/main' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cor_amans-web:${{ github.sha }} .

      - name: Smoke test — import app
        run: |
          docker run --rm \
            -e DATABASE_URL=sqlite:///test.db \
            -e SECRET_KEY=ci-test-key-not-real \
            -e FLASK_ENV=testing \
            cor_amans-web:${{ github.sha }} \
            python -c "from app import app; print('App imports OK')"

  # ── 3. Deploy to staging (staging branch only) ─────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging server
        # Replace with your actual deploy method:
        # SSH + docker compose pull && docker compose up -d
        run: echo "Add SSH deploy step here — see docs/deployment.md"

  # ── 4. Deploy to production (main branch only) ─────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production server
        run: echo "Add SSH deploy step here — see docs/deployment.md"
