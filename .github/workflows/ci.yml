name: CI / CD

# Note: Node.js 20 deprecation warnings from actions/checkout@v4 and
# actions/setup-python@v5 are GitHub's runner upgrade, not our issue.
# No action needed — these still work correctly on Node.js 24.

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

jobs:
  # ── 1. Lint & syntax check ──────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"               # Cache pip between runs

      - name: Install deps
        run: pip install -r requirements.txt flake8

      - name: Flake8
        run: |
          flake8 app.py models.py config.py extensions.py \
            --max-line-length=120 \
            --ignore=E501,W503,W504,E221,E225,E128,E712

      - name: Check templates compile
        env:
          DATABASE_URL: "sqlite:///ci_test.db"
          SECRET_KEY: "ci-only-not-real-key-xxxxxxxxxxxxxxxx"
          FLASK_ENV: "testing"
        run: |
          python - <<'EOF'
          from app import app
          with app.app_context():
              from jinja2 import Environment, FileSystemLoader
              import os
              env = Environment(loader=FileSystemLoader('templates'))
              for root, _, files in os.walk('templates'):
                  for f in files:
                      if f.endswith('.html'):
                          path = os.path.relpath(os.path.join(root, f), 'templates')
                          try:
                              env.get_template(path)
                          except Exception as e:
                              print(f'ERROR in {path}: {e}')
                              raise
          print('All templates OK')
          EOF

  # ── 2. Docker build with layer cache ───────────────────
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 25             # Hard cap — was hanging for 6h without this
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Caches pip-install layer between runs (~18s on cache hit vs 10+ min cold)
      - name: Build image (with GHA layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cor_amans-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — app imports clean
        run: |
          docker run --rm \
            -e DATABASE_URL=sqlite:///test.db \
            -e SECRET_KEY=ci-test-key-not-real \
            -e FLASK_ENV=testing \
            cor_amans-web:${{ github.sha }} \
            python -c "from app import app; print('Import OK')"

  # ── 3. Deploy to staging (staging branch only) ─────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        # SSH into staging server and pull the new image:
        # ssh user@staging "cd /opt/cor_amans && docker compose pull && docker compose up -d"
        run: echo "Configure SSH deploy in GitHub → Settings → Environments → staging"

  # ── 4. Deploy to production (main branch only) ─────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: echo "Configure SSH deploy in GitHub → Settings → Environments → production"
