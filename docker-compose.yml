services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cor_amans_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cor_amans_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    restart: unless-stopped
    # Expose directly for local dev; in production nginx sits in front
    ports:
      - "5001:5000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db/cor_amans_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/static/uploads
    # Scale with: docker compose up --scale web=3
    # (remove ports: above and use nginx instead when scaling)

  # ── Optional: nginx load balancer (uncomment for multi-instance) ──
  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - uploads:/app/static/uploads:ro
  #   depends_on:
  #     - web

volumes:
  postgres_data:
  uploads:
