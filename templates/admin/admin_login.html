<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Sign In — COR AMANS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/admin_minimal.css">
  <style>
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #161b22;
      padding: 1rem;
    }
    .login-wrap {
      width: 100%;
      max-width: 340px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-icon {
      width: 44px; height: 44px;
      border-radius: 10px;
      background: #1a2e1a;
      border: 1px solid rgba(63,185,80,.25);
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 12px;
    }
    .login-icon i { font-size: 18px; color: #3fb950; }
    .login-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 20px;
      font-weight: 700;
      color: #e6edf3;
      margin-bottom: 3px;
    }
    .login-sub {
      font-size: 12px;
      color: #7d8590;
    }
    .login-box {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 24px;
    }
    .lf-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #7d8590;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 5px;
    }
    .lf-input-wrap {
      position: relative;
      margin-bottom: 14px;
    }
    .lf-icon {
      position: absolute;
      left: 10px; top: 50%;
      transform: translateY(-50%);
      color: #7d8590;
      font-size: 12px;
      pointer-events: none;
    }
    .lf-input {
      width: 100%;
      padding: 8px 10px 8px 30px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      color: #e6edf3;
      outline: none;
      transition: border-color .15s;
    }
    .lf-input:focus { border-color: #238636; }
    .lf-input::placeholder { color: #484f58; }
    .pw-btn {
      position: absolute;
      right: 8px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: #7d8590; cursor: pointer;
      padding: 2px; font-size: 12px;
    }
    .pw-btn:hover { color: #e6edf3; }
    .submit-btn {
      width: 100%;
      padding: 9px;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      margin-top: 4px;
    }
    .submit-btn:hover { background: #2ea043; }
    .flash-row {
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      margin-bottom: 14px;
      display: flex; align-items: flex-start; gap: 7px;
    }
    .flash-error   { background: rgba(248,81,73,.12); color: #f85149; border: 1px solid rgba(248,81,73,.2); }
    .flash-success { background: rgba(63,185,80,.1); color: #3fb950; border: 1px solid rgba(63,185,80,.2); }
    .flash-warning { background: rgba(210,153,34,.1); color: #e3b341; border: 1px solid rgba(210,153,34,.2); }
    .login-foot {
      margin-top: 16px;
      text-align: center;
      font-size: 11.5px;
      color: #7d8590;
    }
    .login-foot a { color: #7d8590; text-decoration: none; }
    .login-foot a:hover { color: #e6edf3; }
    .notice {
      font-size: 11px;
      color: #484f58;
      text-align: center;
      margin-top: 20px;
      display: flex; align-items: center; justify-content: center; gap: 5px;
    }
  </style>
</head>
<body>

  <div class="login-wrap">
    <div class="login-header">
      <div class="login-icon"><i class="fas fa-shield-halved"></i></div>
      <div class="login-title">Admin Access</div>
      <div class="login-sub">COR AMANS · Parish Formation System</div>
    </div>

    <div class="login-box">

      <!-- Flash messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
      <div class="flash-row flash-{{ cat }}">
        <i class="fas fa-circle-exclamation"></i>
        <span>{{ msg }}</span>
      </div>
      {% endfor %}
      {% endwith %}

      <form method="POST" action="{{ url_for('admin_login') }}" autocomplete="on" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label class="lf-label" for="email">Email</label>
        <div class="lf-input-wrap">
          <i class="fas fa-envelope lf-icon"></i>
          <input type="email" id="email" name="email" class="lf-input"
                 placeholder="admin@parish.org" autocomplete="email" required>
        </div>

        <label class="lf-label" for="password">Password</label>
        <div class="lf-input-wrap">
          <i class="fas fa-key lf-icon"></i>
          <input type="password" id="password" name="password" class="lf-input"
                 placeholder="Your password" autocomplete="current-password" required>
          <button type="button" class="pw-btn" id="pw-btn">
            <i class="fas fa-eye" id="pw-icon"></i>
          </button>
        </div>

        <button type="submit" class="submit-btn">
          <i class="fas fa-right-to-bracket"></i> Sign in
        </button>
      </form>
    </div>

    <div class="login-foot">
      Not an admin? <a href="{{ url_for('login') }}">Couple login &rarr;</a>
    </div>
    <div class="notice">
      <i class="fas fa-lock" style="font-size:10px;"></i>
      All access is logged
    </div>
  </div>

  <script>
    document.getElementById('pw-btn').addEventListener('click', function(){
      var inp = document.getElementById('password');
      var ico = document.getElementById('pw-icon');
      inp.type = inp.type === 'password' ? 'text' : 'password';
      ico.className = 'fas ' + (inp.type === 'password' ? 'fa-eye' : 'fa-eye-slash');
    });
  </script>
</body>
</html>
