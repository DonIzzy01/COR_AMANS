upstream cor_amans {
    least_conn;               # send to least-busy worker
    server web:5000;          # docker-compose scale web=N adds web_1, web_2 …
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;  # allow PDF/video uploads

    # Static files served directly — never hits Python
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Everything else → Gunicorn workers
    location / {
        proxy_pass         http://cor_amans;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }
}
