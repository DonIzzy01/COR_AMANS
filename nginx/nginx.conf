upstream cor_amans {
    least_conn;             # route to least-busy worker
    server web:5000;        # add more: server web_2:5000; when scaling
    keepalive 64;
}

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript
           application/json image/svg+xml font/woff2;

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;
    keepalive_timeout 65;
    server_tokens off;

    # ── Static files — served by Nginx, never hits Python ──
    location /static/ {
        alias /app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        # Serve pre-compressed .gz files if they exist
        gzip_static on;
    }

    # ── Health check — lightweight, no logging ──────────────
    location /health {
        proxy_pass         http://cor_amans;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log off;
    }

    # ── All other requests → Gunicorn ──────────────────────
    location / {
        proxy_pass         http://cor_amans;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;

        # Circuit-breaker-like: return 503 immediately if all upstreams fail
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # ── Security headers ────────────────────────────────────
    add_header X-Frame-Options        "DENY"            always;
    add_header X-Content-Type-Options "nosniff"         always;
    add_header Referrer-Policy        "strict-origin"   always;
    add_header Permissions-Policy     "geolocation=()"  always;
}
